# LandLens Compose stack (spec 2.17): db, martin, api, web, caddy.
# Only caddy is published on the host (:80, plain HTTP locally; HTTPS is V1 per
# spec 2.15). Every other service talks on the internal Compose network.
# All passwords come from .env via variable substitution (never hard-coded).

services:
  # Postgres 17 + PostGIS + pgvector. The four extensions are created by the
  # image init script (DEC-004/OQ-32) as the owner role on first boot.
  db:
    build: ./db
    environment:
      # DEC-004: the bootstrap user is landlens_owner. POSTGRES_DB is left unset,
      # so the default database is named landlens_owner too.
      POSTGRES_USER: landlens_owner
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_USER"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks:
      - landlens

  # Vector tile server. In M0 there are no tile functions yet (M2), so Martin
  # starts with zero function sources; it connects as landlens_owner until 013
  # (T-M1-5) introduces the read-only landlens_tiles role (spec 2.10, 2.2).
  # One-shot schema phase (spec 2.17: make up runs the schema phase only). Runs before martin and api, so the
  # landlens_tiles role and its password exist before martin connects as it.
  migrate:
    build: ./api
    image: landlens-api:local
    command: ["landlens", "migrate", "--phase", "schema"]
    environment:
      DATABASE_URL: postgresql://landlens_owner:${POSTGRES_PASSWORD}@db:5432/landlens_owner
      LANDLENS_API_PASSWORD: ${LANDLENS_API_PASSWORD}
      LANDLENS_TILES_PASSWORD: ${LANDLENS_TILES_PASSWORD}
    volumes:
      - ./db/migrations:/app/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - landlens

  # Vector tile server (spec 2.2, ADR-007): read-only landlens_tiles role (spec 2.10), function sources only
  # (martin/config.yaml), so no table is ever published directly. Restarted by `make seed` to discover the
  # tile functions created by migration 012.
  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config.yaml"]
    environment:
      # expanded by Martin inside config.yaml (DATABASE_URL itself is deprecated in Martin 1.x)
      MARTIN_PG_DSN: postgresql://landlens_tiles:${LANDLENS_TILES_PASSWORD}@db:5432/landlens_owner
    configs:
      - source: martin
        target: /config.yaml
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - landlens

  # FastAPI on uvicorn (2 workers). Connects to Postgres via DATABASE_URL and
  # exposes /api/health, which the healthcheck and Caddy both rely on.
  api:
    build: ./api
    image: landlens-api:local
    environment:
      DATABASE_URL: postgresql://landlens_owner:${POSTGRES_PASSWORD}@db:5432/landlens_owner
      # the server itself connects as the least-privilege landlens_api role (spec 2.10); the CLI keeps DATABASE_URL
      API_DATABASE_URL: postgresql://landlens_api:${LANDLENS_API_PASSWORD}@db:5432/landlens_owner
      JWT_SECRET: ${JWT_SECRET:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-}
      CHAT_MAX_DISTANCE: ${CHAT_MAX_DISTANCE:-}
      # `landlens migrate` sets the 013 role passwords from these (no secret in any migration file)
      LANDLENS_API_PASSWORD: ${LANDLENS_API_PASSWORD}
      LANDLENS_TILES_PASSWORD: ${LANDLENS_TILES_PASSWORD}
      AS_OF_DATE: ${AS_OF_DATE:-}
    # read-only inputs for the landlens CLI (migrations, DEC-006 seed_inputs); both inside landlens/
    volumes:
      - ./db/migrations:/app/migrations:ro
      - ./seed_inputs:/app/seed_inputs:ro
      - ./bench:/app/bench            # benchmark queries (ro use) and results/*.csv (written by landlens bench)
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - landlens

  # Benchmark runner (spec 2.19): the api image as a one-off job (`make bench`). Runs as the host user, so
  # bench/results/*.csv are not root-owned. Profile "tools": never started by `make up`.
  bench:
    image: landlens-api:local
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"
    command: ["landlens", "bench"]
    environment:
      DATABASE_URL: postgresql://landlens_owner:${POSTGRES_PASSWORD}@db:5432/landlens_owner
      AS_OF_DATE: ${AS_OF_DATE:-}
      HOME: /tmp
      # M5 jobs run here too (make ingest / make eval): the owner's key, paid steps only on their command
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - ./bench:/app/bench
      - ./seed_inputs:/app/seed_inputs   # writable: ingest-pdf writes the embeddings dump (DEC-006)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - landlens

  # pytest (spec 2.16) and the unlock concurrency harness (spec 2.11): the test image with the working tree's
  # api/ mounted at /src, so tests always run the current code. pytest builds its own landlens_test database.
  test:
    build:
      context: ./api
      target: test
    image: landlens-api:test
    profiles: ["tools"]
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    command: ["pytest", "-q", "tests"]
    environment:
      PYTHONPATH: /src
      HOME: /tmp
      PYTHONDONTWRITEBYTECODE: "1"
      DATABASE_URL: postgresql://landlens_owner:${POSTGRES_PASSWORD}@db:5432/landlens_owner
      LANDLENS_API_PASSWORD: ${LANDLENS_API_PASSWORD}
      LANDLENS_TILES_PASSWORD: ${LANDLENS_TILES_PASSWORD}
      LANDLENS_MIGRATIONS_DIR: /migrations
      API_BASE: http://caddy
    volumes:
      - ./api:/src
      - ./db/migrations:/migrations:ro
      - ./bench:/bench
    depends_on:
      db:
        condition: service_healthy
    networks:
      - landlens

  # Next.js production build served with `next start` (not the dev server).
  web:
    build: ./web
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - landlens

  # Reverse proxy: / -> web, /api -> api (prefix kept), /tiles -> martin
  # (prefix stripped). The only host-published port.
  caddy:
    image: caddy:2.11.8
    ports:
      - "80:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      martin:
        condition: service_started
    networks:
      - landlens

# The Caddyfile is delivered as a Compose config (no host bind mount, harness
# safety policy). Its content is read from the file checked in next to this one.
configs:
  caddyfile:
    file: ./Caddyfile
  martin:
    file: ./martin/config.yaml

volumes:
  pgdata:

networks:
  landlens:
