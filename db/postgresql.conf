# LandLens tuned Postgres settings for a 16 GB laptop (spec 2.17).
# The image runs with: postgres -c config_file=/etc/postgresql/postgresql.conf

shared_buffers = 2GB
effective_cache_size = 8GB
work_mem = 64MB
maintenance_work_mem = 1GB          # HNSW and index builds
random_page_cost = 1.1              # SSD
max_wal_size = 4GB                  # bulk loads
shared_preload_libraries = 'pg_stat_statements'

# Allow network connections inside the Compose network.
listen_addresses = '*'
