[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landlens-api"
version = "0.0.0"
description = "LandLens API (FastAPI)."
requires-python = ">=3.12"
# Dependencies limited to spec 2.1 for the M0 health step.
dependencies = [
    "fastapi>=0.111,<1.0",
    "uvicorn>=0.30,<1.0",
    "psycopg[binary]>=3.1,<4.0",
    "pydantic>=2.6,<3.0",
]

[tool.setuptools.packages.find]
include = ["landlens*"]

[tool.ruff]
target-version = "py312"
