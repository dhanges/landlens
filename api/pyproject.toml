[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landlens-api"
version = "0.1.0"
description = "LandLens API (FastAPI) and the landlens data CLI."
requires-python = ">=3.12"
# Exact pins (spec 2.1). Checked against OSV on 2026-11-22: no known vulnerabilities.
dependencies = [
    "fastapi==0.165.0",
    "uvicorn==0.54.0",
    "psycopg[binary]==3.3.9",
    "pydantic==2.14.4",
    "numpy==2.5.4",
    "shapely==2.2.0",
    "argon2-cffi==25.1.0",
    "psycopg-pool==3.3.3",
    "pyjwt==2.15.1",
]
# Checked against OSV on 2026-11-22 (M3): psycopg-pool, pyjwt, pytest, httpx have no known vulnerabilities.

[project.optional-dependencies]
test = ["pytest==9.2.0", "httpx==0.28.1"]

[project.scripts]
landlens = "landlens.cli:main"

[tool.setuptools.packages.find]
include = ["landlens*"]

[tool.setuptools.package-data]
"landlens.gen" = ["*.ql"]

[tool.ruff]
target-version = "py312"
line-length = 120
